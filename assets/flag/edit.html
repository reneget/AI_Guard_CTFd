<label>
	Honeypot (AI Guard)<br>
	<small>A valid solution of the challenge; submitting it raises the account's AI risk score</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="" {% if not data %}selected{% endif %}>Exact match</option>
		<option value="case_insensitive" {% if data == "case_insensitive" %}selected{% endif %}>Exact match, case-insensitive</option>
		<option value="regex" {% if data == "regex" %}selected{% endif %}>Regular expression</option>
		<option value="regex_case_insensitive" {% if data == "regex_case_insensitive" %}selected{% endif %}>Regular expression, case-insensitive</option>
	</select>
</div>
<input type="hidden" name="type" value="honeypot">
<input type="hidden" name="id" value="{{ id }}">
<hr>
<div class="form-group">
	<button class="btn btn-success float-right">Update</button>
</div>
